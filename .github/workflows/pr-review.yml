name: 🔍 PR Review & Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Linting & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pylint flake8 black mypy
      
      - name: Run Pylint
        run: pylint --rcfile=setup.cfg $(find . -name "*.py" -type f | grep -v __pycache__ | head -20)
        continue-on-error: true
      
      - name: Run Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source
        continue-on-error: true
      
      - name: Run Black check
        run: black --check .
        continue-on-error: true
      
      - name: Run Mypy
        run: mypy .
        continue-on-error: true

  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-playwright pytest-django
          playwright install chromium --with-deps
      
      - name: Run tests
        run: pytest -v
        continue-on-error: true

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install audit tools
        run: |
          pip install pip-audit bandit safety
      
      - name: Run pip-audit
        run: pip-audit --desc
        continue-on-error: true
      
      - name: Run Bandit
        run: bandit -r . -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
